# Base44 development stack — runs the app from the cloned source with live reload.
# Local infra credentials are inline; user-supplied secrets come from /run/base44/app.env (last).
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hiredesk
      POSTGRES_PASSWORD: hiredesk
      POSTGRES_DB: hiredesk
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hiredesk -d hiredesk"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: on-failure

  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile.base44
    working_dir: /app/backend
    volumes:
      - .:/app
    environment:
      DATABASE_URL: postgresql+psycopg://hiredesk:hiredesk@db:5432/hiredesk
    env_file:
      - /run/base44/app.env
    command: ["sh", "-ec", "alembic upgrade head"]
    depends_on:
      db:
        condition: service_healthy

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.base44
    working_dir: /app/backend
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://hiredesk:hiredesk@db:5432/hiredesk
      CORS_ORIGINS: "http://localhost:3000,http://127.0.0.1:3000,https://3000-${BASE44_PUBLIC_HOST_SUFFIX}"
      GOOGLE_REDIRECT_URI: "https://8000-${BASE44_PUBLIC_HOST_SUFFIX}/calendar/google/callback"
      FRONTEND_URL: "https://3000-${BASE44_PUBLIC_HOST_SUFFIX}"
    env_file:
      - /run/base44/app.env
    command: ["sh", "-ec", "exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"]
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=3).status == 200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: on-failure

  frontend:
    image: node:22
    working_dir: /app/frontend
    volumes:
      - .:/app
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: "https://8000-${BASE44_PUBLIC_HOST_SUFFIX}"
      BASE44_PUBLIC_HOST_SUFFIX: "${BASE44_PUBLIC_HOST_SUFFIX}"
      WATCHPACK_POLLING: "true"
    command:
      [
        "sh",
        "-ec",
        "if [ ! -f node_modules/.package-lock.json ] || [ package-lock.json -nt node_modules/.package-lock.json ]; then npm ci --no-audit --no-fund; fi && exec npm run dev -- --hostname 0.0.0.0 --port 3000",
      ]
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 120s
    restart: on-failure

volumes:
  db_data:
